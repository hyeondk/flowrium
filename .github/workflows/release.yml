name: 데스크톱 설치 파일 만들기

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 검증할 운영체제
        type: choice
        options: [all, windows]
        default: all
      stage_release:
        description: 선택한 운영체제 검증 후 현재 커밋의 비공개 릴리스 준비
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    outputs:
      mac_ready: ${{ steps.signing.outputs.ready }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"label":"Windows","runner":"windows-latest","os":"win","arch":"x64"}]' || '[{"label":"Mac Apple Silicon","runner":"macos-15","os":"mac","arch":"arm64"},{"label":"Windows","runner":"windows-latest","os":"win","arch":"x64"}]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 버전과 태그 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release-tag.mjs
      - run: npm ci
      - name: 독립 Node와 GitHub 실행 도구 준비
        run: npm run prepare:runtime
      - name: Windows 업데이트 도우미 시작 검사
        if: runner.os == 'Windows'
        run: |
          node scripts/build-win-updater.cjs
          node tests/update-native-e2e.cjs --windows-helper-smoke
      - run: npm run build
      - name: 가상 터미널 검증
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: node --test --test-reporter=spec tests/terminal.test.cjs
      - run: npm test
        timeout-minutes: 5
      - name: 다운로드 페이지 확인
        run: node scripts/verify-downloads.mjs
      - name: 다운로드 페이지 실제 브라우저 확인
        run: node tests/download-page-e2e.cjs
      - name: Mac 서명 및 공증 설정 확인
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "$CERT" && -n "$ACCOUNT" && -n "$PASSWORD" && -n "$TEAM" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Apple 공증 정보 없음 / 임시 서명 Mac 배포본을 검사합니다."
          fi
        env:
          CERT: ${{ secrets.MAC_CSC_LINK }}
          ACCOUNT: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
      - name: Mac 임시 서명 패키지 생성
        if: runner.os == 'macOS' && steps.signing.outputs.ready != 'true'
        run: npx --no-install electron-builder --mac --arm64 --publish never --config.mac.identity=- --config.mac.hardenedRuntime=false --config.dmg.sign=false
      - name: 임시 서명 디스크 이미지 설치 및 실행 검증
        if: runner.os == 'macOS' && steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          image=(release/Flowrium-*-mac-arm64.dmg)
          scratch=$(mktemp -d)
          mkdir "$scratch/mount" "$scratch/Applications"
          hdiutil verify "${image[0]}"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$scratch/mount" "${image[0]}"
          trap 'hdiutil detach "$scratch/mount" -quiet; /bin/rm -rf "$scratch"' EXIT
          app="$scratch/Applications/Flowrium.app"
          ditto "$scratch/mount/Flowrium.app" "$app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Flowrium")" = arm64
          node tests/terminal-packaged-e2e.cjs "$app"
      - name: Mac 배포용 앱 서명 및 공증 / 디스크 이미지 공증
        if: runner.os == 'macOS' && steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          npx --no-install electron-builder --mac --arm64 --publish never --config.forceCodeSigning=true --config.mac.notarize=true
          image=(release/Flowrium-*-mac-arm64.dmg)
          archive=(release/Flowrium-*-mac-arm64.zip)
          xcrun notarytool submit "${image[0]}" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$RUNNER_TEMP/flowrium-notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/flowrium-notary.json"
          xcrun stapler staple "${image[0]}"
          bash scripts/verify-macos-release.sh "${image[0]}" "${archive[0]}" "$APPLE_TEAM_ID"
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Windows 설치 파일 생성
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in @('WIN_CSC_LINK', 'WIN_CSC_KEY_PASSWORD', 'CSC_LINK', 'CSC_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
          }
          npx --no-install electron-builder --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: 번들 Codex 실행 파일 확인
        run: node scripts/verify-native.cjs
      - name: 패키지 내장 터미널 검증
        run: node tests/terminal-packaged-e2e.cjs
      - name: 실제 앱에서 업무 대화 검증
        run: node tests/desktop-e2e.cjs
      - name: 대시보드와 프로젝트·보관·업무 도구
        run: node tests/portfolio-e2e.cjs
      - name: 팀 배정·결정·완료 보고
        run: node tests/teams-directed-e2e.cjs
      - name: 독립 Git 작업 환경과 통합
        run: node tests/team-worktrees-ui.cjs
      - name: Codex 질문의 보기·직접 답변과 비밀 입력
        run: |
          node tests/input-request-e2e.cjs
          node tests/input-native-e2e.cjs
      - name: 잠금·로그아웃·초안 복원
        run: node tests/security-e2e.cjs
      - name: 미전송 초안의 이전·계정별 복원
        run: node tests/drafts-e2e.cjs
      - name: 개인 메모와 프로젝트 지시·비서
        run: node tests/memory-e2e.cjs
      - name: 음악·음성 입력의 실제 화면
        run: |
          node tests/desktop-tools-e2e.cjs
          node tests/voice-e2e.cjs
      - name: 휴대폰 화면과 인증
        run: node tests/mobile-e2e.cjs
      - name: 문서 내보내기 검증
        run: node tests/workbench-document-e2e.cjs
      - name: Mac 앱의 실제 업데이트·수동 설치 버튼
        if: runner.os == 'macOS'
        run: node tests/update-mac-click-e2e.cjs
      - name: 운영체제별 업데이트 검증
        run: node tests/update-native-e2e.cjs ${{ runner.os == 'macOS' && steps.signing.outputs.ready != 'true' && '--expect-unsigned' || '' }}
      - name: 설치 파일 보관
        uses: actions/upload-artifact@v6
        with:
          name: flowrium-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/Flowrium-*-${{ matrix.os }}-${{ matrix.arch }}.dmg
            release/Flowrium-*-${{ matrix.os }}-${{ matrix.arch }}.zip
            release/Flowrium-*-${{ matrix.os }}-${{ matrix.arch }}.exe

  draft:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && inputs.stage_release)
    name: 초안 릴리스 저장
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          pattern: flowrium-*
          merge-multiple: true
          path: release
      - name: 체크섬 생성
        run: node scripts/create-checksums.mjs release
      - name: 초안 릴리스에만 업로드
        run: node scripts/save-draft-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE_FROM_MAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.stage_release }}
          EXPECT_MAC: 'true'
