name: 데스크톱 설치 파일 만들기

on:
  push:
    tags: ['v*', '[0-9][0-9][0-9][0-9][0-9][0-9]_*']
  workflow_dispatch:
    inputs:
      platform:
        description: 검증할 운영체제
        type: choice
        options: [all, windows]
        default: all
      test_scope:
        description: 전체 배포 검증 또는 Codex 접근 범위만 빠르게 점검
        type: choice
        options: [all, scopes, features]
        default: all
      stage_release:
        description: 선택한 운영체제 검증 후 현재 커밋의 비공개 릴리스 준비
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scopes:
    if: inputs.test_scope == 'scopes'
    name: Windows 대화 접근 범위 점검
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: node tests/conversation-scopes-native-e2e.cjs
  features:
    if: inputs.test_scope == 'features'
    name: Windows 신규 기능 점검
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run prepare:runtime
      - run: npm run build
      - name: 신규 기능별 실제 앱 검사
        run: |
          result=0
          for feature in migration voice-servers project-ports portfolio-reports-popup codex-transfer settings-layout long-conversation chat-layout navigation-layout feature-surfaces
          do
            if ! node "tests/${feature}-e2e.cjs"
            then
              result=1
            fi
          done
          exit "$result"
  build:
    if: inputs.test_scope != 'scopes' && inputs.test_scope != 'features'
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    outputs:
      mac_ready: ${{ steps.signing.outputs.ready }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"label":"Windows","runner":"windows-latest","os":"win","arch":"x64"}]' || '[{"label":"Mac Apple Silicon","runner":"macos-15","os":"mac","arch":"arm64"},{"label":"Windows","runner":"windows-latest","os":"win","arch":"x64"}]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 버전과 태그 확인
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-tag.mjs
      - run: npm ci
      - name: 독립 Node와 GitHub 실행 도구 준비
        run: npm run prepare:runtime
      - name: Mac 기본 일정 도우미 준비
        if: runner.os == 'macOS'
        run: node scripts/build-native.cjs
      - name: Windows 업데이트 도우미 시작 검사
        if: runner.os == 'Windows'
        run: |
          node scripts/build-win-updater.cjs
          node tests/update-native-e2e.cjs --windows-helper-smoke
      - run: npm run build
      - name: 가상 터미널 검증
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: node --test --test-reporter=spec tests/terminal.test.cjs
      - run: npm test
        timeout-minutes: 5
      - name: 다운로드 페이지 확인
        run: node scripts/verify-downloads.mjs
      - name: 다운로드 페이지 실제 브라우저 확인
        run: node tests/download-page-e2e.cjs
      - name: Mac 서명 및 공증 설정 확인
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "$CERT" && -n "$ACCOUNT" && -n "$PASSWORD" && -n "$TEAM" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Apple 공증 정보 없음 / 임시 서명 Mac 배포본을 검사합니다."
          fi
        env:
          CERT: ${{ secrets.MAC_CSC_LINK }}
          ACCOUNT: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
      - name: Mac 임시 서명 패키지 생성
        if: runner.os == 'macOS' && steps.signing.outputs.ready != 'true'
        run: npx --no-install electron-builder --mac --arm64 --publish never --config.mac.identity=- --config.mac.hardenedRuntime=false --config.dmg.sign=false
      - name: 임시 서명 디스크 이미지 설치 및 실행 검증
        if: runner.os == 'macOS' && steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          image=(release/Flowrium-*-mac-arm64.dmg)
          scratch=$(mktemp -d)
          mkdir "$scratch/mount" "$scratch/Applications"
          hdiutil verify "${image[0]}"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$scratch/mount" "${image[0]}"
          trap 'hdiutil detach "$scratch/mount" -quiet; /bin/rm -rf "$scratch"' EXIT
          app="$scratch/Applications/Flowrium.app"
          ditto "$scratch/mount/Flowrium.app" "$app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Flowrium")" = arm64
          node tests/terminal-packaged-e2e.cjs "$app"
      - name: Mac 배포용 앱 서명 및 공증 / 디스크 이미지 공증
        if: runner.os == 'macOS' && steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          npx --no-install electron-builder --mac --arm64 --publish never --config.forceCodeSigning=true --config.mac.notarize=true
          image=(release/Flowrium-*-mac-arm64.dmg)
          archive=(release/Flowrium-*-mac-arm64.zip)
          xcrun notarytool submit "${image[0]}" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$RUNNER_TEMP/flowrium-notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/flowrium-notary.json"
          xcrun stapler staple "${image[0]}"
          bash scripts/verify-macos-release.sh "${image[0]}" "${archive[0]}" "$APPLE_TEAM_ID"
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Windows 설치 파일 생성
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in @('WIN_CSC_LINK', 'WIN_CSC_KEY_PASSWORD', 'CSC_LINK', 'CSC_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
          }
          npx --no-install electron-builder --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: 번들 Codex 실행 파일 확인
        run: node scripts/verify-native.cjs
      - name: 공개 패키지의 개인 자료 제외 검사
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            node scripts/verify-release-privacy.cjs --resources release/win-unpacked/resources
          else
            node scripts/verify-release-privacy.cjs --resources release/mac-arm64/Flowrium.app/Contents/Resources
          fi
      - name: 패키지 내장 터미널 검증
        run: node tests/terminal-packaged-e2e.cjs
      - name: 실제 앱에서 업무 대화 검증
        id: verify_1
        continue-on-error: true
        run: node tests/desktop-e2e.cjs
      - name: 탐색 레일·대화함·동작·실행 상태
        id: verify_2
        continue-on-error: true
        run: |
          node tests/ui-motion-e2e.cjs
          node tests/workspace-shell-e2e.cjs
          node tests/conversation-scopes-native-e2e.cjs
      - name: 대시보드와 프로젝트·보관·업무 도구
        id: verify_3
        continue-on-error: true
        run: node tests/portfolio-e2e.cjs
      - name: 첨부·실행 큐·네이티브 분기와 되감기
        id: verify_4
        continue-on-error: true
        run: |
          node tests/chat-core-e2e.cjs
          node tests/chat-core-native-e2e.cjs
      - name: 목표·그래프·산출물·복원과 실제 모델 도구
        id: verify_5
        continue-on-error: true
        run: |
          node tests/portfolio-extensions-e2e.cjs
          node tests/project-ai-native-e2e.cjs
          node tests/html-export-electron.cjs
      - name: 대화 위임·비서 보고·기억·동적 팀
        id: verify_6
        continue-on-error: true
        run: |
          node tests/workflow-e2e.cjs
          node tests/teams-automation-e2e.cjs
      - name: 외부 자료·일정 검토·연결 주소 전달
        id: verify_7
        continue-on-error: true
        run: |
          node tests/external-integrations-e2e.cjs
          node tests/link-delivery-e2e.cjs
      - name: 팀 배정·결정·완료 보고
        id: verify_8
        continue-on-error: true
        run: node tests/teams-directed-e2e.cjs
      - name: 독립 Git 작업 환경과 통합
        id: verify_9
        continue-on-error: true
        run: node tests/team-worktrees-ui.cjs
      - name: Codex 질문의 보기·직접 답변과 비밀 입력
        id: verify_10
        continue-on-error: true
        run: |
          node tests/input-request-e2e.cjs
          node tests/input-native-e2e.cjs
      - name: 잠금·로그아웃·초안 복원
        id: verify_11
        continue-on-error: true
        run: node tests/security-e2e.cjs
      - name: 미전송 초안의 이전·계정별 복원
        id: verify_12
        continue-on-error: true
        run: node tests/drafts-e2e.cjs
      - name: 개인 메모와 프로젝트 지시·비서
        id: verify_13
        continue-on-error: true
        run: node tests/memory-e2e.cjs
      - name: 음악·음성 입력의 실제 화면
        id: verify_14
        continue-on-error: true
        run: |
          node tests/desktop-tools-e2e.cjs
          node tests/voice-e2e.cjs
          node tests/voice-continuous-e2e.cjs
      - name: 휴대폰 화면과 인증
        id: verify_15
        continue-on-error: true
        run: |
          node tests/mobile-e2e.cjs
          node tests/mobile-extensions-e2e.cjs
      - name: 터미널 설치 파일의 검증과 백업
        id: verify_16
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          node scripts/create-checksums.mjs release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            node tests/installer-windows-e2e.cjs --installer "release/Flowrium-$(node -p '(require("./package.json").flowriumVersion || require("./package.json").version)')-win-x64.exe" --checksums release/SHA256SUMS.txt
          else
            node tests/installer-mac-e2e.cjs
          fi
      - name: 문서 내보내기 검증
        id: verify_17
        continue-on-error: true
        run: node tests/workbench-document-e2e.cjs
      - name: Mac 앱의 실제 업데이트·수동 설치 버튼
        id: verify_18
        continue-on-error: true
        if: runner.os == 'macOS'
        run: node tests/update-mac-click-e2e.cjs
      - name: 운영체제별 업데이트 검증
        id: verify_19
        if: runner.os == 'macOS'
        continue-on-error: true
        run: node tests/update-native-e2e.cjs ${{ runner.os == 'macOS' && steps.signing.outputs.ready != 'true' && '--expect-unsigned' || '' }}
      - name: 전체 자료 이관 / 음성 서버 관리 / 자동 포트표 / 보고 팝업
        id: verify_20
        continue-on-error: true
        run: |
          result=0
          for feature in migration voice-servers project-ports portfolio-reports-popup
          do
            if ! node "tests/${feature}-e2e.cjs"
            then
              result=1
            fi
          done
          exit "$result"
      - name: Codex 프로젝트 대화 연결 / 설정 배치
        id: verify_21
        continue-on-error: true
        run: |
          node tests/codex-transfer-e2e.cjs
          node tests/settings-layout-e2e.cjs
          node tests/long-conversation-e2e.cjs
      - name: 넓은 대화 / 본문 높이 / 입력 영역 / 스크롤 위치
        id: verify_22
        continue-on-error: true
        run: node tests/chat-layout-e2e.cjs
      - name: 긴 프로젝트 목록 / 메뉴 구획 / 화면 높이별 배치
        id: verify_23
        continue-on-error: true
        run: node tests/navigation-layout-e2e.cjs
      - name: 기능별 화면 / 여백 / 작은 화면 / 가로 넘침
        id: verify_24
        continue-on-error: true
        run: node tests/feature-surfaces-e2e.cjs
      - name: 모든 검증 결과 확인
        if: ${{ !cancelled() }}
        env:
          FLOWRIUM_CHECK_OUTCOMES: ${{ join(steps.*.outcome, ',') }}
          FLOWRIUM_JOB_STATUS: ${{ job.status }}
        run: |
          node -e "const values=process.env.FLOWRIUM_CHECK_OUTCOMES.split(',');if(values.includes('failure')||process.env.FLOWRIUM_JOB_STATUS==='failure'){console.error('실패한 검증이 있어 배포 파일 보관을 중단합니다.');process.exit(1)}console.log('모든 필수 검증 통과')"
      - name: 설치 파일 보관
        uses: actions/upload-artifact@v6
        with:
          name: flowrium-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/Flowrium-*-${{ matrix.os }}-${{ matrix.arch }}.dmg
            release/Flowrium-*-${{ matrix.os }}-${{ matrix.arch }}.zip
            release/Flowrium-*-${{ matrix.os }}-${{ matrix.arch }}.exe

  windows_install:
    if: inputs.test_scope != 'scopes' && inputs.test_scope != 'features'
    name: Windows 설치와 업데이트 독립 검증
    needs: build
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run prepare:runtime
      - run: node scripts/build-win-updater.cjs
      - run: npm run build
      - uses: actions/download-artifact@v6
        with:
          name: flowrium-win-x64
          path: release
      - name: 검사할 설치 파일 체크섬
        run: node scripts/create-checksums.mjs release
      - name: 이전 버전에서 수동 설치 / 재설치 / 백업 / 초안 복원
        id: install
        continue-on-error: true
        timeout-minutes: 18
        run: node tests/installer-windows-e2e.cjs --installer "release/Flowrium-$(node -p '(require("./package.json").flowriumVersion || require("./package.json").version)')-win-x64.exe" --checksums release/SHA256SUMS.txt
      - name: 날짜 버전 업데이트 버튼 / 실제 설치 / 재시작 / 초안 복원
        id: update
        continue-on-error: true
        timeout-minutes: 12
        run: node tests/update-native-e2e.cjs
      - name: 설치와 업데이트 최종 결과 확인
        if: ${{ !cancelled() }}
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: node -e "if(process.env.INSTALL_OUTCOME!=='success'||process.env.UPDATE_OUTCOME!=='success')process.exit(1);console.log('Windows 실제 설치와 업데이트 모두 통과')"

  draft:
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && inputs.stage_release)
    name: 초안 릴리스 저장
    needs: [build, windows_install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          pattern: flowrium-*
          merge-multiple: true
          path: release
      - name: 체크섬 생성
        run: |
          node scripts/prepare-release-assets.mjs release
          node scripts/create-checksums.mjs release
      - name: 초안 릴리스에만 업로드
        run: node scripts/save-draft-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE_FROM_MAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.stage_release }}
          EXPECT_MAC: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'windows' }}
