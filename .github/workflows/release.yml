name: 신뢰한 Windows 프로젝트의 이전 대화 권한 검증
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: node --test tests/windows-project-sandbox.test.cjs
      - run: node tests/project-edit-native-e2e.cjs
