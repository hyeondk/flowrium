name: 윈도우 실제 파일 권한 원인 검사
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        mode: [elevated, unelevated]
    env:
      FLOWRIUM_TEST_WINDOWS_SANDBOX: ${{ matrix.mode }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: node tests/project-edit-native-e2e.cjs
