name: 양쪽 데스크톱 본문 재렌더링 검증
on: workflow_dispatch
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run prepare:runtime
      - run: npm run build
      - run: node tests/message-content-e2e.cjs
