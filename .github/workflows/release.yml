name: 이전 공개판의 설치와 초안 보존 진단
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run prepare:runtime
      - uses: actions/download-artifact@v6
        with:
          name: flowrium-win-x64
          path: release
          run-id: 44131266411
          github-token: ${{ github.token }}
      - run: node scripts/create-checksums.mjs release
      - run: node tests/installer-windows-e2e.cjs --installer "release/Flowrium-261117_01-win-x64.exe" --checksums release/SHA256SUMS.txt
